name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  # CI - сборка и тестирование
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Formatting
        run: mvn fmt:check

      - name: Build, Test and Generate Coverage Report
        run: mvn -B clean verify

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: coverage-report/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: false

      - name: Commit and Push Badges
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/badges/*.svg
          git commit -m "ci: update jacoco coverage badges [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # Запускаем только при пуше в ветку main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR files
        run: mvn -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Images
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/$OWNER_LOWER"
          
          echo "Registry path: $REGISTRY"
          
          docker build -t $REGISTRY/discovery-server:latest ./discovery-server
          docker push $REGISTRY/discovery-server:latest
          
          docker build -t $REGISTRY/api-gateway:latest ./api-gateway
          docker push $REGISTRY/api-gateway:latest
          
          docker build -t $REGISTRY/inventory-service:latest ./inventory-service
          docker push $REGISTRY/inventory-service:latest
          
          docker build -t $REGISTRY/order-service:latest ./order-service
          docker push $REGISTRY/order-service:latest
          
          docker build -t $REGISTRY/notification-service:latest ./notification-service
          docker push $REGISTRY/notification-service:latest
          
          docker build -t $REGISTRY/user-service:latest ./user-service
          docker push $REGISTRY/user-service:latest
          
          docker build -t $REGISTRY/cart-service:latest ./cart-service
          docker push $REGISTRY/cart-service:latest
          
          docker build -t $REGISTRY/frontend-vue:latest ./frontend-vue
          docker push $REGISTRY/frontend-vue:latest
