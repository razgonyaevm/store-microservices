name: Java CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # CI - сборка и тестирование
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Formatting
        run: mvn fmt:check

      - name: Compile and Package All Modules
        run: mvn -B clean package -DskipTests

      - name: Run Integration Tests
        run: mvn -B test -pl inventory-service

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # Запускаем только при пуше в ветку main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR files
        run: mvn -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Images
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/$OWNER_LOWER"
          
          echo "Registry path: $REGISTRY"
          
          docker build -t $REGISTRY/discovery-server:latest ./discovery-server
          docker push $REGISTRY/discovery-server:latest
          
          docker build -t $REGISTRY/api-gateway:latest ./api-gateway
          docker push $REGISTRY/api-gateway:latest
          
          docker build -t $REGISTRY/inventory-service:latest ./inventory-service
          docker push $REGISTRY/inventory-service:latest
          
          docker build -t $REGISTRY/order-service:latest ./order-service
          docker push $REGISTRY/order-service:latest
          
          docker build -t $REGISTRY/notification-service:latest ./notification-service
          docker push $REGISTRY/notification-service:latest
          
          docker build -t $REGISTRY/user-service:latest ./user-service
          docker push $REGISTRY/user-service:latest
          
          docker build -t $REGISTRY/frontend-vue:latest ./frontend-vue
          docker push $REGISTRY/frontend-vue:latest
