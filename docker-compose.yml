version: '3.8'

services:
  # База данных для inventory-service
  inventory-db:
    image: postgres:15-alpine
    container_name: inventory-db
    ports:
      - "5431:5432" # 5431 для хоста, внутри сети docker это 5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    volumes:
      - pgdata_inventory:/var/lib/postgresql/data

  # База данных для order-service
  order-db:
    image: postgres:15-alpine
    container_name: order-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_db
    volumes:
      - pgdata_order:/var/lib/postgresql/data

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    volumes:
      - pgdata_user:/var/lib/postgresql/data

  # Zookeeper необходим для работы Kafka в текущей стандартной конфигурации
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIMER: 2000

  # Брокер сообщений Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    environment:
      - EUREKA_HOST=discovery-server
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - ZIPKIN_HOST=zipkin
      - JWT_SECRET=${JWT_SECRET}

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    depends_on:
      - inventory-db
      - discovery-server
    environment:
      - DB_HOST=inventory-db
      - DB_PORT=5432
      - EUREKA_HOST=discovery-server
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - ZIPKIN_HOST=zipkin

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - order-db
      - discovery-server
      - kafka
    environment:
      - DB_HOST=order-db
      - DB_PORT=5432
      - EUREKA_HOST=discovery-server
      # Переопределяем адрес брокера через стандартную переменную Spring Boot
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - ZIPKIN_HOST=zipkin

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-server
      - kafka
    environment:
      - EUREKA_HOST=discovery-server
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - ZIPKIN_HOST=zipkin

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"

  frontend-vue:
    build: ./frontend-vue
    container_name: frontend-vue
    ports:
      - "3000:80" # Маппим внешний порт 3000 на внутренний порт Nginx 80
    depends_on:
      - api-gateway

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8084:8084"
    depends_on:
      - user-db
      - discovery-server
    environment:
      - DB_HOST=user-db
      - DB_PORT=5432
      - EUREKA_HOST=discovery-server
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}

volumes:
  pgdata_inventory:
  pgdata_order:
  pgdata_user:

